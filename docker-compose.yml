services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-ai_tutor}
    volumes:
      # This is the entire point of the migration — a named volume survives
      # `docker compose down` / `up` and container restarts alike, unlike the
      # old Render free-tier disk. Only `docker compose down -v` removes it.
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-ai_tutor}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Java/Spring Boot backend (replaces the old Node/Express one — see
    # backend-java/README or the root README's "Recent updates" section). The
    # original Node Dockerfile is left in place at the repo root during cutover
    # verification; point `dockerfile` back at it if you need to compare the two
    # side by side against this same database.
    build:
      context: .
      dockerfile: backend-java/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-ai_tutor}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${APP_PORT:-4000}:4000'

volumes:
  db_data:
